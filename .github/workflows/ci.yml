name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Required for Codecov and semantic-release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pdm install --dev
        working-directory: ./backend

      - name: Run Linting
        run: pdm lint-ci
        working-directory: ./backend

      - name: Run Unit Tests
        run: pdm test-ci
        working-directory: ./backend

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5.5.2
        with:
          files: coverage.xml
          flags: unittests
          report_type: coverage
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v5.5.2
        with:
          files: junit.xml
          flags: unittests
          report_type: test_results
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
  snyk:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pdm install --dev
        working-directory: ./backend
      - name: Export dependencies for Snyk
        run: pdm export -f requirements --without-hashes --output requirements.txt
        working-directory: ./backend
      - name: Install exported requirements
        run: pip install -r requirements.txt
        working-directory: ./backend
      - name: Install Snyk CLI
        run: npm install -g snyk snyk-to-sarif
      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}
      - name: Run Snyk test and generate SARIF
        run: snyk test --file=requirements.txt --sarif-file-output=snyk-report.sarif || true
        working-directory: ./backend
      - name: Upload Snyk SARIF report to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-report.sarif
        if: always()  # Ensure this runs even if Snyk test fails
      - name: Monitor dependencies in Snyk
        run: snyk monitor --file=requirements.txt
        working-directory: ./backend
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        run: ruff check backend/
  build:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build backend image
        run: |
          docker build -t $REGISTRY/$IMAGE_NAME-backend:latest ./backend

      - name: Build frontend image
        run: |
          docker build -t $REGISTRY/$IMAGE_NAME-frontend:latest ./frontend

      - name: Push backend image
        if: github.ref == 'refs/heads/main'
        run: docker push $REGISTRY/$IMAGE_NAME-backend:latest

      - name: Push frontend image
        if: github.ref == 'refs/heads/main'
        run: docker push $REGISTRY/$IMAGE_NAME-frontend:latest
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install dependencies (semantic-release)
        run: npm install -g semantic-release @semantic-release/changelog @semantic-release/git
      
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release