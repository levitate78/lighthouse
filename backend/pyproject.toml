[project]
name = "lighthouse"
version = "0.1.0"
description = "Python backend for Lighthouse."

dependencies = [
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1",
    "flask-apscheduler>=1.13",
    "python-dotenv>=1.0",
    "requests>=2.33.0",
    "flask-dance>=7.1",
    "flask-login>=0.6",
    "flask-wtf>=1.2",
    "email-validator>=2.3.0",
    "python-gitlab>=4.0",
    "flask-limiter>=4.1.1",
    "flask-cors>=6.0.2",
    "cryptography>=46.0.7",
    "gunicorn>=22.0.0",
    "psycopg2-binary>=2.9.11",
]
requires-python = "==3.12.*"
readme = "README.md"
license = {text = "aGPL-3.0-only"}


[tool.pdm]
distribution = false


[tool.pdm.dev-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "ruff"
]

[tool.pdm.scripts]
test = "pytest --cov=app --cov-report=term-missing"
lint = { composite = ["ruff format .", "ruff check ."] }
test-ci = "pytest --cov=app --cov-branch --cov-report=xml --junitxml=junit.xml -o junit_family=legacy"
lint-ci = { composite = ["ruff format .", "ruff check --output-format=github ."] }

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
