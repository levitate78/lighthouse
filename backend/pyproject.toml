[project]
name = "lighthouse"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "levitate78", email = "github.penholder993@passinbox.com"},
]
dependencies = [
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "flask-apscheduler>=1.13",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "flask-dance>=7.1",
    "flask-login>=0.6",
    "flask-wtf>=1.2",
    "email-validator>=2.3.0",
    "python-gitlab>=4.0",
    "flask-limiter>=4.1.1",
    "flask-cors>=6.0.2",
]
requires-python = "==3.12.*"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = false

[dependency-groups]
dev = [
    "safety>=3.7.0",
]

