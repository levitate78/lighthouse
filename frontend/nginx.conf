events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # Security headers applied to all responses
    add_header X-Content-Type-Options  "nosniff"                    always;
    add_header X-Frame-Options         "DENY"                       always;
    add_header X-XSS-Protection        "1; mode=block"              always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # Cache hashed Vite assets forever (the hash changes when content changes)
    map $uri $vite_asset {
        ~*/assets/  1;
        default     0;
    }

    server {
        listen 80;
        server_name localhost;

        root  /usr/share/nginx/html;
        index index.html;

        # ── Backend proxy ─────────────────────────────────────────────────

        # All API calls (including /api/csrf-token and /api/health)
        location /api/ {
            proxy_pass         http://backend:5000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Server-rendered auth pages (WTForms + flash messages)
        location ~ ^/(login|logout|signup|change[-_]password)(/.*)?$ {
            proxy_pass         http://backend:5000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Static assets — long-lived cache for hashed bundles ───────────
        location /assets/ {
            expires    1y;
            add_header Cache-Control "public, immutable";
        }

        # ── SPA fallback — serve index.html for all other paths ───────────
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}